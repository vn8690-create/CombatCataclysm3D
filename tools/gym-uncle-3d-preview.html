<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Combat Cataclysm | Gym Uncle GLB Preview</title>
  <style>
    * { box-sizing: border-box; } html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #101321; color: #fff; }
    #viewport { position: fixed; inset: 0; } #panel { position: fixed; z-index: 2; top: 14px; left: 14px; width: min(400px, calc(100vw - 28px)); padding: 16px; border-radius: 12px; background: #161c30eb; border: 1px solid #4d587c; }
    h1 { font-size: 18px; margin: 0 0 12px; } label { display: block; font-size: 13px; margin-top: 9px; } input, select, button { width: 100%; margin-top: 5px; font: inherit; padding: 7px; border-radius: 5px; } p { font-size: 12px; line-height: 1.5; color: #c8d6f7; } #status { overflow-wrap: anywhere; }
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
  <div id="viewport"></div>
  <section id="panel">
    <h1>🏋️ Gym Uncle 3D Lab</h1>
    <label for="model">Choose a self-contained .glb model (no upload to any server)</label>
    <input id="model" type="file" accept=".glb,model/gltf-binary">
    <label for="clip">Animation clip</label><select id="clip" disabled><option>No model loaded</option></select>
    <button id="play" disabled>Pause animation</button>
    <p id="status" role="status">Choose Gym Uncle GLB. Mouse: drag to rotate, wheel to zoom. Preview does not affect the game.</p>
  </section>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const viewport = document.querySelector('#viewport');
    const status = document.querySelector('#status');
    const fileInput = document.querySelector('#model');
    const clipsInput = document.querySelector('#clip');
    const playButton = document.querySelector('#play');
    const scene = new THREE.Scene(); scene.background = new THREE.Color('#101321');
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, .01, 1000);
    camera.position.set(3.5, 2.7, 5.5);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace; viewport.append(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x636583, 2));
    const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(4, 7, 5); scene.add(key);
    const floor = new THREE.GridHelper(10, 20, 0x7781a6, 0x333950); scene.add(floor);
    const axes = new THREE.AxesHelper(1); scene.add(axes);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.target.set(0, 1, 0); controls.update();
    const clock = new THREE.Clock(); let model = null; let mixer = null; let action = null; let sourceUrl = null;
    let clips = [];
    const setStatus = text => { status.textContent = text; };
    function reset() {
      action?.stop(); mixer?.stopAllAction(); mixer = null; action = null; clips = [];
      if (model) { scene.remove(model); model = null; }
      clipsInput.replaceChildren(new Option('No animation', ''));
      clipsInput.disabled = true; playButton.disabled = true;
    }
    function playClip(index) {
      if (!mixer || !clips[index]) return;
      action?.stop(); action = mixer.clipAction(clips[index]); action.reset().play();
      playButton.textContent = 'Pause animation';
    }
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files?.[0]; if (!file) return;
      reset(); if (sourceUrl) URL.revokeObjectURL(sourceUrl);
      sourceUrl = URL.createObjectURL(file);
      setStatus(`Loading ${file.name}...`);
      new GLTFLoader().load(sourceUrl, gltf => {
        model = gltf.scene; scene.add(model);
        const bounds = new THREE.Box3().setFromObject(model);
        if (!bounds.isEmpty()) {
          const size = bounds.getSize(new THREE.Vector3()); const center = bounds.getCenter(new THREE.Vector3());
          const extent = Math.max(size.x, size.y, size.z, .1);
          controls.target.copy(center); camera.position.copy(center).add(new THREE.Vector3(extent * 1.5, extent * 1.05, extent * 2.1));
          camera.near = Math.max(.001, extent / 100); camera.far = Math.max(100, extent * 100); camera.updateProjectionMatrix(); controls.update();
        }
        clips = gltf.animations || [];
        clipsInput.replaceChildren(new Option(clips.length ? 'Select clip' : 'No animation in GLB', ''));
        for (let i = 0; i < clips.length; i++) clipsInput.add(new Option(`${clips[i].name} (${clips[i].duration.toFixed(2)}s)`, String(i)));
        if (clips.length) { mixer = new THREE.AnimationMixer(model); clipsInput.disabled = false; playButton.disabled = false; clipsInput.value = '0'; playClip(0); }
        setStatus(`Loaded ${file.name}. ${clips.length} animation clip(s). If zero, model generation succeeded but rig/animation is still needed.`);
      }, undefined, err => { reset(); setStatus(`Could not load GLB: ${err.message || String(err)}. Export a self-contained binary GLB from Blender.`); });
    });
    clipsInput.addEventListener('change', () => playClip(Number(clipsInput.value)));
    playButton.addEventListener('click', () => {
      if (!action) return;
      action.paused = !action.paused;
      playButton.textContent = action.paused ? 'Resume animation' : 'Pause animation';
    });
    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
    function frame() { requestAnimationFrame(frame); const dt = Math.min(clock.getDelta(), .05); mixer?.update(dt); controls.update(); renderer.render(scene, camera); }
    frame();
  </script>
</body>
</html>
